<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="2026년 2학기 AI와 디지털 리터러시 주차별 강의교안" />
  <title>AI와 디지털 리터러시 | 2026-2</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="overrides.css" />
  <link rel="stylesheet" href="theme-blue.css" />
  <style>
    .lecture-grid { grid-auto-rows: 1fr; }
    .lecture-card {
      height: 100%;
      background: linear-gradient(180deg, #effcf8 0%, #ffffff 24%, #ffffff 76%, #f1faf7 100%);
    }
    .lecture-card h3 { min-height: 68px; }
    .lecture-card p { flex: 1; min-height: 94px; }
    .lecture-card__cta {
      width: fit-content;
      align-self: flex-start;
      justify-content: flex-start;
      gap: 10px;
      margin-top: 34px;
      padding: 11px 15px;
      border: 1.5px solid var(--accent);
      background: #fff;
      color: var(--accent-strong);
      box-shadow: none;
    }
    .lecture-card:hover .lecture-card__cta,
    .lecture-card:focus-visible .lecture-card__cta {
      background: #fff;
      color: var(--accent-strong);
      border-color: var(--accent-strong);
      box-shadow: 0 6px 18px rgba(37,99,235,.10);
    }
    @media (max-width: 640px) {
      .lecture-card h3,
      .lecture-card p { min-height: 0; }
      .lecture-card__cta {
        width: fit-content;
        margin-top: 30px;
        padding: 11px 14px;
      }
    }
  </style>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="hero">
    <div class="container hero__inner">
      <p class="eyebrow">2026 · 2학기</p>
      <h1>AI와 디지털 리터러시</h1>
      <p class="hero__desc">인공지능의 원리부터 정보 검증, 데이터·윤리·보안, 생성형 AI 콘텐츠 제작까지 15주 과정으로 학습합니다.</p>
    </div>
  </header>

  <nav class="agenda" aria-label="주차별 아젠다">
    <div class="container agenda__inner" id="agendaNav"></div>
  </nav>

  <main id="main">
    <section class="section intro-section">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">COURSE OVERVIEW</p>
          <h2>주차별 강의목록</h2>
          <p>1주차 교안이 공개되어 있으며 이후 주차는 순차적으로 연결됩니다.</p>
        </div>
        <div class="lecture-grid" id="lectureList" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <strong>AI와 디지털 리터러시</strong>
      <span>2026년 2학기 · 주차별 강의교안</span>
    </div>
  </footer>

  <button class="top-button" id="topButton" type="button" aria-label="페이지 맨 위로 이동">TOP</button>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="availability.js"></script>
</body>
</html>
